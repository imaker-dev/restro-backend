# MariaDB Configuration for Restro POS Free Version
# This is a template — the launcher script generates the actual config
# with correct paths at runtime.

[mysqld]
port=3307
skip-networking=0
bind-address=0.0.0.0
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci

# Performance settings for POS workload
innodb_buffer_pool_size=256M
innodb_log_file_size=64M
innodb_flush_log_at_trx_commit=2
innodb_flush_method=O_DIRECT
max_connections=50
table_open_cache=200
query_cache_type=1
query_cache_size=32M

# Security
local-infile=0

[client]
port=3307
default-character-set=utf8mb4
